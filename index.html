var(--accent);margin-top:2px}.check:has(input:checked) span{text-decoration:line-through;color:#71818c}textarea,input[type=text],select{border:1px solid #aebfcc;border-radius:8px;padding:12px;background:white;width:100%;color:#203340}textarea{min-height:120px;resize:vertical}label.field{display:block;font-size:14px;margin:15px 0 7px}.note-text{white-space:pre-wrap;overflow-wrap:anywhere;margin:8px 0}.notehead{display:flex;justify-content:space-between;align-items:center;gap:8px}.empty{padding:28px 12px;text-align:center;color:#536775}details{padding:14px 0}summary{cursor:pointer;line-height:1.7}#status{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);background:#143954;color:white;padding:12px 20px;border-radius:10px;z-index:10;max-width:90vw}#status:empty{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(min-width:700px){header{padding-top:32px;padding-bottom:30px}.route{font-size:30px}main{padding-top:26px}.timeline{padding:8px 24px}.event{grid-template-columns:80px 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<header><div class="top"><div><h1>出差口袋</h1><p id="tripperiod"></p></div><span class="tag" id="tripowner"></span></div><div class="route" id="triproute"></div></header>
<main id="main"></main><nav aria-label="主要功能"></nav><div id="status" role="status" aria-live="polite"></div>
<dialog id="confirmbox"><p id="confirmtext"></p><div class="actions"><button class="btn" id="confirmcancel">取消</button><button class="btn primary" id="confirmok">確定</button></div></dialog><script src="trip.js"></script><script src="packing.js"></script><script src="reimbursement.js"></script><script>
'use strict';
const KEY='g2e-trip-v1';let state={notes:[],checks:{}};let storageOK=true;try{const saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved&&Array.isArray(saved.notes)&&saved.checks&&typeof saved.checks==='object')state=saved}catch(e){storageOK=false}
let tab='行程',day=0,editing=null;const today=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Los_Angeles',month:'numeric',day:'numeric'}).format(new Date());const ti=DAYS.findIndex(d=>d[0]===today);if(ti>=0)day=ti;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const link=(url,label)=>`<a class="btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">${label}</a>`;const main=document.getElementById('main');
function toast(s){document.getElementById('status').textContent=s;clearTimeout(toast.timer);toast.timer=setTimeout(()=>document.getElementById('status').textContent='',4500)}
function appConfirm(message){return new Promise(resolve=>{const box=document.getElementById('confirmbox');document.getElementById('confirmtext').textContent=message;const finish=value=>{box.close();resolve(value)};document.getElementById('confirmok').onclick=()=>finish(true);document.getElementById('confirmcancel').onclick=()=>finish(false);box.oncancel=e=>{e.preventDefault();finish(false)};box.showModal()})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true;return true}catch(e){storageOK=false;toast('儲存空間無法使用，請先匯出備份。');return false}}
function nav(){const icons=['<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18"/>','<rect x="5" y="6" width="14" height="15" rx="2"/><path d="M9 6V3h6v3M9 10v7m6-7v7"/>','<path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM8 8h8m-8 4h8m-8 4h4"/>','<path d="M14 4H4v16h16V10M11 13l2-5 6-6 3 3-6 6z"/>','<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'];document.querySelector('nav').innerHTML=['行程','行李','報帳','備忘','更多'].map((t,i)=>`<button data-tab="${t}" ${(tab===t||(t==='更多'&&['班機','住宿','提醒'].includes(tab)))?'aria-current="page"':''}><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${icons[i]}</svg>${t}</button>`).join('')}
function more(){main.innerHTML='<h2>旅程資訊</h2><section class="panel menu"><button class="btn" data-tab="班機">班機與訂位資訊 →</button><button class="btn" data-tab="住宿">住宿與聯絡人 →</button><button class="btn" data-tab="提醒">助理出差提醒 →</button></section><p class="muted">出差口袋 v1.2 · 私人資料只留在目前裝置。備份功能在「備忘」頁。</p>'}
function render(){tripHeader();nav();if(!trip&&['行程','班機','住宿','提醒'].includes(tab)){emptyTrip();return;}if(tab==='行程')itinerary();if(tab==='班機')flights();if(tab==='住宿')hotel();if(tab==='提醒')reminders();if(tab==='備忘')notes();if(tab==='行李')packing();if(tab==='報帳')reimbursement();if(tab==='更多')more()}
function itinerary(){const d=DAYS[day];const dayNotes=state.notes.filter(n=>n.category===d[0]||n.category==='整趟出差');main.innerHTML=`<div class="actions quick"><button class="btn" data-tab="班機">班機資訊</button><button class="btn" data-tab="住宿">住宿導航</button><button class="btn" data-tab="提醒">助理提醒</button></div><div class="dates" aria-label="選擇日期">${DAYS.map((x,i)=>`<button data-day="${i}" aria-pressed="${day===i}"><small style="color:inherit">${esc(x[0]).split('/')[0]} 月</small><b>${esc(x[0]).split('/')[1]}</b>週${esc(x[1])}</button>`).join('')}</div><div class="dayhead"><h2>${esc(d[2])}</h2><span class="pill">${esc(trip.timezones[day])}</span></div>${day===0?`<div class="notice">${esc(trip.timezoneNotice)}</div>`:''}<div class="timeline">${d[3].map(e=>`<article class="event"><div class="time">${esc(e[0])}</div><div><h3>${esc(e[1])}</h3><p>${esc(e[2])}</p></div></article>`).join('')}</div>${dayNotes.length?`<section class="panel"><h3>這天的備忘</h3>${dayNotes.map(n=>`<p class="note-text">${esc(n.text)}</p>`).join('')}</section>`:''}<div class="actions"><button class="btn primary" data-new-note="${esc(d[0])}">＋ 記下這天的備忘</button>${link(SOURCES.sheet,'助理原始行程表')}</div><p class="muted">依 ${esc(trip.sheetDate)} 表單整理 · 集合地點與臨時變更以助理群組通知為準。未指定鐘點的活動保留「上午／飛行中」等標示。</p>`}
function flights(){main.innerHTML=`<h2>我的班機</h2><p class="muted">依個人電子機票整理。時間皆為出發／抵達地當地時間；不是即時航班動態。</p>${FLIGHTS.map(f=>`<article class="panel"><div class="flighttop"><strong>${esc(f.no)}</strong><span>${esc(f.date)}</span></div><small>${esc(f.air)} · ${esc(f.cabin)}</small><div class="airports"><div>${esc(f.from)}<b>${esc(f.dep)}</b><small>${esc(f.dt)}</small></div><span aria-hidden="true">→</span><div class="end">${esc(f.to)}<b>${esc(f.arr)}</b><small>${esc(f.at)}</small></div></div><div class="line">${esc(f.term)}<br>預選座位 <strong>${esc(f.seat)}</strong> · ${esc(f.baggage)}<details><summary>航空公司訂位代號</summary><strong>${esc(f.ref)}</strong> <button class="btn" data-copy="${esc(f.ref)}">複製</button></details></div></article>`).join('')}<div class="notice">跨日航班請同時核對出發及抵達日期。航廈與座位仍須以航空公司最新通知及登機證為準。</div>${link(SOURCES.flight,'開啟原始機票')}<p class="muted">機票來源日期：${esc(trip.ticketDate)}。</p>`}
function hotel(){const h=trip.hotel;main.innerHTML=`<h2>住宿與聯絡</h2><section class="panel"><span class="pill">${esc(h.dates)}</span><h3 style="font-size:26px;margin-top:12px">${esc(h.name)}</h3><p>${esc(h.address)}</p><div class="actions">${link('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(h.name+' '+h.address),'地圖導航')}<button class="btn" data-copy="${esc(h.address)}">複製地址</button><a class="btn" href="tel:${esc(h.phone)}">撥打飯店</a></div><dl class="facts"><dt>房型</dt><dd>${esc(h.room)}</dd><dt>早餐／接送</dt><dd>${esc(h.services)}</dd><dt>行程安排</dt><dd>${esc(h.schedule)}</dd><dt>入住姓名</dt><dd>${esc(h.guest)}</dd></dl><details><summary>住宿憑證與訂房資訊</summary><p>${esc(h.booking)}</p>${link(SOURCES.hotel,'開啟住宿券')}</details></section><div class="notice">${esc(h.notice)}</div><section class="panel"><h3>旅行社聯絡人</h3><p>${esc(h.agent)}</p><div class="actions"><a class="btn" href="tel:${esc(h.agentPhone)}">${esc(h.agentPhone)}</a><a class="btn" href="tel:${esc(h.agentMobile)}">${esc(h.agentMobile)}</a><a class="btn" href="mailto:${esc(h.agentEmail)}">寄信給承辦人</a></div></section>`}
function reminders(){const total=CHECKS.flatMap(x=>x[1]).length,done=CHECKS.reduce((n,g,i)=>n+g[1].filter((_,j)=>state.checks[i+'-'+j]).length,0);main.innerHTML=`<div class="dayhead"><h2>出差提醒</h2><span class="pill">已完成 ${done} / ${total}</span></div><p class="muted">勾選僅存在這個裝置；以下由助理表單整理。</p>${CHECKS.map((g,i)=>`<section class="panel"><h3>${esc(g[0])}</h3>${g[1].map((s,j)=>`<label class="check"><input type="checkbox" data-check="${i}-${j}" ${state.checks[i+'-'+j]?'checked':''}><span>${esc(s)}</span></label>`).join('')}</section>`).join('')}<section class="panel"><h3>助理提供的其他提醒</h3>${trip.reminderNotes.map(n=>`<p>${esc(n)}</p>`).join('')}</section>${link(SOURCES.sheet,'查看助理完整表單')}`}
function notes(){const current=state.notes.find(n=>n.id===editing);main.innerHTML=`<h2>我的備忘</h2><p class="muted">助理臨時交代、集合地點或房號，直接記在這裡。${storageOK?'儲存在目前瀏覽器，不會自動跨裝置同步。':'目前無法持久儲存，請匯出備份。'}</p><form id="noteform" class="panel"><h3>${current?'編輯備忘':'新增備忘'}</h3><label class="field" for="category">放在哪裡</label><select id="category"><option>整趟出差</option>${DAYS.map(d=>`<option>${esc(d[0])}</option>`).join('')}<option>班機</option><option>住宿</option><option>注意事項</option></select><label class="field" for="note">內容</label><textarea id="note" required maxlength="10000" placeholder="例如：明天提早 15 分鐘，在飯店大廳集合。">${esc(current?.text||'')}</textarea><div class="actions"><button class="btn primary" type="submit">${current?'儲存修改':'儲存備忘'}</button>${current?'<button class="btn" type="button" data-cancel>取消</button>':''}</div></form><div id="notelist">${state.notes.length?state.notes.map(n=>`<article class="panel"><div class="notehead"><span class="pill">${esc(n.category)}</span><small>${esc(n.updated)}</small></div><p class="note-text">${esc(n.text)}</p><div class="actions"><button class="btn" data-edit="${esc(n.id)}">編輯</button><button class="btn" data-delete="${esc(n.id)}">刪除</button></div></article>`).join(''):'<div class="empty">還沒有備忘。把第一件要記住的事寫下來。</div>'}</div><section class="panel"><h3>備份與換裝置</h3><p class="muted">匯出包含私人行程、備忘、提醒、行李勾選及自訂物品。請勿公開備份。清除瀏覽器資料前請備份。匯入會取代目前紀錄。</p><div class="actions"><button class="btn" data-export>匯出備份</button><button class="btn" data-import>匯入備份</button><input type="file" id="importfile" accept="application/json,.json" hidden></div></section><details><summary>資料來源與使用方式</summary><p class="muted">${trip?`私人資料讀取日 ${esc(trip.readDate)}，表單日期 ${esc(trip.sheetDate)}，機票日期 ${esc(trip.ticketDate)}，住宿券日期 ${esc(trip.hotelDate)}。`:'尚未匯入私人行程。'}原始檔更新後，此 App 不會自動同步。</p><p class="muted">手機正式使用需 HTTPS 網址。iPhone 可從 Safari 分享選單「加入主畫面」；Android 可由瀏覽器安裝或加入主畫面。首次連線載入後可離線查看內建資訊，原始文件、地圖與電話功能仍依裝置及網路狀態。</p>${trip?link(SOURCES.sheet,'行程表')+link(SOURCES.flight,'機票')+link(SOURCES.hotel,'住宿券'):''}<div class="actions"><button class="btn" data-trip-import>匯入／更換私人行程</button></div><input type="file" id="tripfile" accept="application/json,.json" hidden></details>`;if(current)document.getElementById('category').value=current.category}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;editing=null;render();window.scrollTo(0,0)}if(b.dataset.day!==undefined){day=Number(b.dataset.day);itinerary()}if(b.dataset.newNote){tab='備忘';editing=null;render();document.getElementById('category').value=b.dataset.newNote;document.getElementById('note').focus()}if(b.dataset.copy){try{await navigator.clipboard.writeText(b.dataset.copy);toast('已複製')}catch{toast('無法自動複製，請長按文字複製。')}}if(b.dataset.edit){editing=b.dataset.edit;notes();window.scrollTo(0,0)}if(b.hasAttribute('data-cancel')){editing=null;notes()}if(b.dataset.delete&&await appConfirm('刪除這則備忘？')){state.notes=state.notes.filter(n=>n.id!==b.dataset.delete);save();notes()}if(b.hasAttribute('data-export')){const blob=new Blob([JSON.stringify({version:2,...state,trip},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='g2e-trip-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}if(b.hasAttribute('data-import'))document.getElementById('importfile').click()});
document.addEventListener('submit',e=>{if(e.target.id!=='noteform')return;e.preventDefault();const value=document.getElementById('note').value.trim();if(!value){toast('請先輸入備忘內容');return}const entry={id:editing||Date.now().toString(36)+Math.random().toString(36).slice(2),text:value,category:document.getElementById('category').value,updated:new Date().toLocaleDateString('zh-TW')};if(editing)state.notes=state.notes.map(n=>n.id===editing?entry:n);else state.notes.unshift(entry);editing=null;const ok=save();notes();toast(ok?'備忘已儲存':'目前僅暫存，請匯出備份。')});
document.addEventListener('change',async e=>{if(e.target.dataset.check){state.checks[e.target.dataset.check]=e.target.checked;save();reminders()}if(e.target.id==='importfile'&&e.target.files[0]){try{if(e.target.files[0].size>2000000)throw Error();const data=JSON.parse(await e.target.files[0].text());const nextTrip=data.trip?validateTrip(data.trip):trip;const cats=['整趟出差',...(nextTrip?.days||[]).map(d=>d[0]),'班機','住宿','注意事項'];if(![1,2].includes(data.version)||!Array.isArray(data.notes)||data.notes.length>1000||!data.checks||typeof data.checks!=='object'||data.notes.some(n=>typeof n.id!=='string'||typeof n.text!=='string'||n.text.length>10000||!cats.includes(n.category)||typeof n.updated!=='string'))throw Error();const checks={};(nextTrip?.checks||CHECKS).forEach((g,i)=>g[1].forEach((_,j)=>checks[i+'-'+j]=data.checks[i+'-'+j]===true));const packed=normalizedPacking(data);if(await appConfirm('匯入備份將取代目前備忘與勾選紀錄，確定繼續？')){state={notes:data.notes.map(n=>({id:n.id,text:n.text,category:n.category,updated:n.updated})),checks,...packed};if(nextTrip){localStorage.setItem(TRIP_KEY,JSON.stringify(nextTrip));trip=nextTrip;SOURCES=trip.sources;DAYS=trip.days;FLIGHTS=trip.flights;CHECKS=trip.checks;day=0;}const ok=save();tripHeader();notes();toast(ok?'已匯入備份':'已匯入，但目前無法持久儲存')}}catch{toast('這不是有效的出差口袋備份，原紀錄未變更。')}}});
render();if('serviceWorker' in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
